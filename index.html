<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rythu Mitrudu — AP Agriculture</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }
        canvas { display: block; }

        /* ─── Config / Password Panel ─── */
        #configPanel {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(160deg, #0d1117 0%, #1a2540 100%);
            display: flex; align-items: center; justify-content: center;
        }
        #configPanel.hidden { display: none; }
        .config-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px; padding: 32px 28px;
            width: 380px; max-width: 92vw;
            text-align: center;
        }
        .config-box .logo {
            font-size: 42px; color: #4caf50; margin-bottom: 10px;
        }
        .config-box h2 {
            font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #fff;
        }
        .config-box .subtitle {
            font-size: 12px; color: #8899aa; margin-bottom: 22px;
        }
        .config-box .input-wrap {
            position: relative; margin-bottom: 6px;
        }
        .config-box .input-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #8899aa; font-size: 14px;
        }
        .config-box input {
            width: 100%; padding: 12px 14px 12px 40px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: #fff; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        .config-box input:focus { border-color: #4caf50; }
        #passwordError {
            color: #f66; font-size: 12px; margin-bottom: 10px; display: none;
        }
        .config-box button {
            margin-top: 14px; width: 100%; padding: 13px;
            background: #4caf50; border: none; border-radius: 8px;
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s;
        }
        .config-box button:hover:not(:disabled) { background: #43a047; }
        .config-box button:disabled { background: #2e4a2e; color: #6a8f6a; cursor: not-allowed; }

        /* ─── Connection Overlay (shown after password, until both WS connect) ─── */
        #connOverlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(10, 15, 25, 0.88);
            backdrop-filter: blur(6px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px;
        }
        #connOverlay.visible { display: flex; }
        .conn-spinner {
            width: 64px; height: 64px; border-radius: 50%;
            border: 3px solid rgba(76,175,80,0.2);
            border-top-color: #4caf50;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #connOverlay .conn-label {
            font-size: 16px; font-weight: 600; color: #c8d8c8;
        }
        #connOverlay .conn-rows {
            display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
        }
        .conn-row {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: #8899aa;
        }
        .conn-row i { width: 18px; text-align: center; }
        .conn-row.done { color: #4caf50; }
        .conn-row.done .fa-circle-notch { display: none; }
        .conn-row.done .fa-circle-check { display: inline-block !important; }
        .conn-row .fa-circle-check { display: none; color: #4caf50; }
        .conn-row .fa-circle-notch { animation: spin 1s linear infinite; color: #8899aa; }

        /* ─── Top Bar ─── */
        #topBar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            display: none; align-items: center; justify-content: space-between;
            padding: 8px 14px;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #topBar .left {
            display: flex; align-items: center; gap: 14px;
        }
        .conn-pill {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; color: #8899aa;
            background: rgba(255,255,255,0.06);
            border-radius: 20px; padding: 3px 9px;
        }
        .conn-pill i { font-size: 8px; }
        .conn-pill.on i { color: #4caf50; }
        .conn-pill.off i { color: #f44; }
        #statusText { font-size: 12px; color: #8899aa; }

        /* ─── Agent State Indicator (top-right) ─── */
        #agentStateIndicator { display: none; align-items: center; gap: 6px; }
        .state-badge {
            display: none; align-items: center; gap: 5px;
            font-size: 12px; font-weight: 600;
            background: rgba(255,255,255,0.07);
            border-radius: 20px; padding: 3px 10px;
        }
        .state-dot {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
        }
        .thinking-dot {
            background: #fbbf24;
            animation: thinkPulse 1.4s ease-in-out infinite;
        }
        .listening-dot {
            background: #4caf50;
            animation: listenPulse 0.9s ease-in-out infinite;
        }
        @keyframes thinkPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        @keyframes listenPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        #waveformIndicator {
            display: none; align-items: flex-end; gap: 3px; height: 22px;
            background: rgba(255,255,255,0.07); border-radius: 20px; padding: 3px 10px;
        }
        .wave-bar {
            width: 3px; min-height: 3px; background: #4caf50; border-radius: 2px;
            animation: waveBounce 0.85s ease-in-out infinite;
        }
        .wave-bar:nth-child(1) { animation-delay: 0.00s; }
        .wave-bar:nth-child(2) { animation-delay: 0.17s; }
        .wave-bar:nth-child(3) { animation-delay: 0.34s; }
        .wave-bar:nth-child(4) { animation-delay: 0.17s; }
        .wave-bar:nth-child(5) { animation-delay: 0.00s; }
        @keyframes waveBounce {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }

        /* ─── Bottom Controls ─── */
        #controls {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
            display: none; align-items: center; justify-content: center;
            padding: 14px 10px; gap: 16px;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .ctrl-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .ctrl-btn:active { transform: scale(0.93); }
        #micBtn { background: #c0392b; color: #fff; }
        #micBtn.active { background: #27ae60; }
        #micBtn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
        #endBtn { background: #7f1d1d; color: #fca5a5; }
        #endBtn:hover { background: #991b1b; }
        #infoBtn { background: rgba(255,255,255,0.1); color: #ccc; }
        #infoBtn.active { background: #4caf50; color: #fff; }

        /* ─── Debug/Info Panel ─── */
        #infoPanel {
            position: fixed; bottom: 80px; left: 10px; right: 10px; z-index: 10;
            display: none; max-height: 40vh; overflow-y: auto;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            border-radius: 10px; padding: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            font-size: 11px; font-family: monospace; white-space: pre-wrap; color: #ff0;
        }
        #emotions {
            color: #4caf50; font-family: 'Segoe UI', sans-serif;
            margin-bottom: 8px; white-space: normal;
        }

        /* ─── Emotion Panel (bottom-left) ─── */
        #emotionBadge {
            position: fixed; bottom: 82px; left: 14px; z-index: 11;
            display: flex; flex-direction: column; gap: 5px;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 8px 12px;
            font-size: 12px; color: #e0e0e0;
            min-width: 170px;
            transition: opacity 0.4s;
        }
        #emotionBadge .emo-row {
            display: flex; align-items: center; gap: 6px;
        }
        #emotionBadge .emo-icon { font-size: 14px; line-height: 1; width: 18px; text-align: center; }
        #emotionBadge .emo-name {
            font-weight: 600; text-transform: capitalize;
            width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #emotionBadge .emo-bar-wrap {
            flex: 1; height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden;
        }
        #emotionBadge .emo-bar {
            height: 100%; border-radius: 2px;
        }
        #emotionBadge .emo-pct {
            font-size: 10px; color: rgba(255,255,255,0.5); width: 26px; text-align: right;
        }

        /* ─── Mobile tweaks ─── */
        @media (max-width: 600px) {
            .config-box { padding: 22px 18px; }
            .ctrl-btn { width: 46px; height: 46px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- Bottom Controls -->

    <!-- Collapsible Info Panel -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ════════════════════════════════════════════════════════════
        //  Configuration
        // ════════════════════════════════════════════════════════════
        const SEND_SAMPLE_RATE = 16000;
        const RECEIVE_SAMPLE_RATE = 24000;
        const GEMINI_MODEL = 'models/gemini-3.1-flash-live-preview';
        const A2F_PROXY_URL = 'wss://farmer-helper-agent-proxy-for-a2f.fly.dev/';
        const A2F_SAMPLE_RATE = 24000;

        // ── Encrypted Google API Key ──────────────────────────────
        // Run `node encrypt_key.mjs` once and paste the output here.
        // Format: base64(salt[16] + iv[12] + ciphertext + authTag[16])
        const ENCRYPTED_KEY = 'Y7v73/Z7D+RIaraexR1QqwxoSBi+QkAKqhdY+3VpECScG1kY2UMHkF5o5rodRAqVZ18V0i1S48QD+dSr7MH8/hl8cfF+vOa5TjM2tqlFach/fyc=';

        async function _deriveKey(password, salt) {
            const raw = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                raw,
                { name: 'AES-GCM', length: 256 },
                false, ['decrypt']
            );
        }

        async function decryptApiKey(password) {
            try {
                const bytes = Uint8Array.from(atob(ENCRYPTED_KEY), c => c.charCodeAt(0));
                const salt  = bytes.slice(0, 16);
                const iv    = bytes.slice(16, 28);
                const data  = bytes.slice(28); // ciphertext + authTag (WebCrypto AES-GCM format)
                const key   = await _deriveKey(password, salt);
                const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                return new TextDecoder().decode(plain);
            } catch {
                return null;
            }
        }

        // ════════════════════════════════════════════════════════════
        //  State
        // ════════════════════════════════════════════════════════════
        let config = null;
        let geminiWs = null;
        let micStream = null;
        let micProcessor = null;
        let audioCtx = null;
        let isSessionActive = false;
        let micActive = false;

        // A2F streaming state
        const a2fAudioBuffer = [];
        let a2fSendTimer = null;
        const A2F_CHUNK_MS = 100;
        let a2fBlendshapeNames = [];
        let a2fWs = null;
        let a2fStreamReady = false;

        // Lipsync: queue blendshape frames, only start audio when frames arrive
        const a2fBsQueue = [];        // {bsDict, timeCode, headRotation, emotions}
        let audioStartTime = null;    // performance.now() when we actually started audio playback
        let waitingForA2F = false;    // true = audio buffered but waiting for first blendshapes
        let _a2fWaitStart = null;     // timeout tracker for A2F wait
        let _loggedAnimOnce = false;  // debug: log first animation once

        // ════════════════════════════════════════════════════════════
        //  Audio Playback (Web Audio API)
        // ════════════════════════════════════════════════════════════
        let playbackQueue = [];       // AudioBuffer objects waiting to play
        let isPlaying = false;
        const activeSources = [];      // currently scheduled/playing WebAudio nodes

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioContext({ sampleRate: RECEIVE_SAMPLE_RATE });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function queueAudioForPlayback(pcmBase64) {
            initAudioContext();
            const raw = atob(pcmBase64);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

            // Send to A2F — start a new gRPC stream if needed
            if (!a2fStreamReady && a2fWs?.readyState === WebSocket.OPEN) {
                a2fWs.send(JSON.stringify({ type: 'start' }));
                a2fStreamReady = true;
                console.log('[A2F] Started new gRPC stream');
            }
            // Agent is now responding — no longer "thinking"
            if (turnInFlight) { turnInFlight = false; updateAgentState(); }
            a2fAudioBuffer.push(bytes.buffer.slice(0));

            const buffer = audioCtx.createBuffer(1, float32.length, RECEIVE_SAMPLE_RATE);
            buffer.getChannelData(0).set(float32);
            playbackQueue.push(buffer);

            // If audio hasn't started yet, hold it — wait for A2F blendshapes
            if (audioStartTime === null) {
                waitingForA2F = true;
            } else {
                // Audio already playing (mid-utterance), schedule immediately
                drainAudioQueue();
            }
        }

        // Called when first A2F blendshape frames arrive, or as fallback after timeout
        function startAudioPlayback() {
            if (audioStartTime !== null) return; // already started
            if (playbackQueue.length === 0) return;
            waitingForA2F = false;
            audioStartTime = performance.now();
            console.log(`[Sync] Starting audio playback, ${playbackQueue.length} buffers queued, ${a2fBsQueue.length} BS frames ready`);
            isPlaying = true;
            updateAgentState();
            nextPlayTime = audioCtx.currentTime;
            drainAudioQueue();
        }

        let nextPlayTime = 0;
        function drainAudioQueue() {
            while (playbackQueue.length > 0) {
                const buffer = playbackQueue.shift();
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                const startTime = Math.max(audioCtx.currentTime, nextPlayTime);
                source.start(startTime);
                nextPlayTime = startTime + buffer.duration;
                activeSources.push(source);
                source.onended = () => {
                    const idx = activeSources.indexOf(source);
                    if (idx !== -1) activeSources.splice(idx, 1);
                    if (playbackQueue.length > 0) drainAudioQueue();
                    else if (playbackQueue.length === 0) { isPlaying = false; updateAgentState(); }
                };
            }
        }

        function stopAllAudio() {
            playbackQueue.length = 0;
            isPlaying = false;
            nextPlayTime = 0;
            // Stop all nodes that are currently scheduled or playing
            for (const src of activeSources) {
                try { src.stop(); } catch (_) {}
            }
            activeSources.length = 0;
            updateAgentState();
        }

        // ════════════════════════════════════════════════════════════
        //  Gemini Live WebSocket
        // ════════════════════════════════════════════════════════════
        const SYSTEM_PROMPT = `మీరు ఆంధ్రప్రదేశ్ ప్రభుత్వ వ్యవసాయ శాఖ యొక్క AI రైతు మిత్రుడు (Rythu Mitrudu).
మీరు Andhra Pradesh Government Agriculture Department తరఫున రైతులకు సేవ అందిస్తున్నారు.

భాష:
- మీరు ప్రధానంగా తెలుగులో మాట్లాడతారు.
- వినేవారు హిందీలో మాట్లాడితే హిందీలో, ఇంగ్లీష్‌లో మాట్లాడితే ఇంగ్లీష్‌లో జవాబు ఇవ్వండి.
- వినేవారు అడిగితే భాష మారండి.

గ్రీటింగ్:
- మీరు ప్రతిసారి session మొదలైనప్పుడు, మొదటి మాటగా ఇలా చెప్పండి: "నమస్కారం అండీ, నేను మీకు ఎలా సహాయపడగలను?"

గౌరవం:
- పేరు తెలియకపోతే "అండీ" అని సంబోధించండి (ఎప్పుడూ పేరు లేకుండా మాట్లాడేటప్పుడు).
- పేరు తెలిస్తే "[పేరు] గారు" అని సంబోధించండి.
- "మీరు", "మీకు", "వారు", "ఆయన/ఆమె" వంటి గౌరవప్రద సర్వనామాలు మాత్రమే వాడండి.
- "నువ్వు", "వాడు", "దాని", "ఏంటిరా" వంటి పదాలు వాడకండి.

స్వరం మరియు భావం:

- అయినప్పటికీ గౌరవప్రదమైన, అధికారికమైన స్వరం ఎప్పుడూ వీడకండి — ఉత్సాహం అనవసర ఆర్భాటంగా మారకూడదు.`;

        function connectGemini() {
            const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${config.googleKey}`;
            setStatus('connecting', 'Connecting to Gemini...');

            geminiWs = new WebSocket(url);

            geminiWs.onopen = () => {
                console.log('[Gemini] WebSocket connected, sending setup...');
                const setupMsg = {
                    setup: {
                        model: GEMINI_MODEL,
                        generationConfig: {
                            responseModalities: ['AUDIO'],
                            mediaResolution: 'MEDIA_RESOLUTION_MEDIUM',
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: 'Zephyr' }
                                }
                            }
                        },
                        systemInstruction: {
                            parts: [{ text: SYSTEM_PROMPT }]
                        },
                        realtimeInputConfig: {
                            activityHandling: 'START_OF_ACTIVITY_INTERRUPTS',
                            turnCoverage: 'TURN_INCLUDES_ONLY_ACTIVITY',
                            automaticActivityDetection: {
                                disabled: false,
                                startOfSpeechSensitivity: 'START_SENSITIVITY_HIGH',
                                endOfSpeechSensitivity: 'END_SENSITIVITY_HIGH',
                                silenceDurationMs: 400
                            }
                        },
                        tools: [{ googleSearch: {} }]
                    }
                };
                geminiWs.send(JSON.stringify(setupMsg));
            };

            geminiWs.onmessage = async (event) => {
                let text;
                if (event.data instanceof Blob) {
                    text = await event.data.text();
                } else {
                    text = event.data;
                }
                let msg;
                try {
                    msg = JSON.parse(text);
                } catch (e) {
                    console.warn('[Gemini] Non-JSON message:', text.slice(0, 100));
                    return;
                }

                // Setup complete
                if (msg.setupComplete) {
                    console.log('[Gemini] Setup complete');
                    isSessionActive = true;
                    geminiConnected = true;
                    updateConnIndicators();
                    startA2FChunkTimer(); // starts interval; connectA2FProxy already called, so this is a no-op for WS
                    return;
                }

                // Server content (audio response)
                if (msg.serverContent) {
                    const sc = msg.serverContent;
                    if (sc.modelTurn && sc.modelTurn.parts) {
                        for (const part of sc.modelTurn.parts) {
                            if (part.inlineData && part.inlineData.mimeType.startsWith('audio/')) {
                                queueAudioForPlayback(part.inlineData.data);
                            }
                            if (part.text) {
                                console.log('[Gemini] Text:', part.text);
                            }
                        }
                    }
                    if (sc.turnComplete) {
                        console.log('[Gemini] Turn complete');
                        turnInFlight = false;
                        updateAgentState();
                        // Flush remaining A2F audio and signal end of this clip
                        flushA2FAudio();
                    }
                    if (sc.interrupted) {
                        console.log('[Gemini] Interrupted');
                        turnInFlight = false;
                        stopAllAudio();
                        a2fAudioBuffer.length = 0;
                        a2fBsQueue.length = 0;
                        audioStartTime = null;
                        waitingForA2F = false;
                        if (a2fStreamReady && a2fWs?.readyState === WebSocket.OPEN) {
                            a2fWs.send(JSON.stringify({ type: 'end' }));
                            a2fStreamReady = false;
                        }
                        updateAgentState();
                    }
                }

                // Tool calls
                if (msg.toolCall) {
                    handleToolCall(msg.toolCall);
                }
            };

            geminiWs.onclose = (e) => {
                console.log('[Gemini] Disconnected', e.code, e.reason);
                isSessionActive = false;
                geminiConnected = false;
                updateConnIndicators();
                setStatus('disconnected', 'Disconnected');
                stopA2FChunkTimer();
            };

            geminiWs.onerror = (err) => {
                console.error('[Gemini] Error', err);
                setStatus('disconnected', 'Connection error');
            };
        }

        function handleToolCall(toolCall) {
            if (!toolCall.functionCalls) return;
            for (const fc of toolCall.functionCalls) {
                console.log(`[Tool] ${fc.name} called`, fc.args);
                let result = 'unknown function';
                // No face recognition tools — all removed
                const response = {
                    toolResponse: {
                        functionResponses: [{
                            name: fc.name,
                            id: fc.id,
                            response: { result }
                        }]
                    }
                };
                geminiWs.send(JSON.stringify(response));
            }
        }

        function sendAudioToGemini(pcmBase64) {
            if (!geminiWs || geminiWs.readyState !== WebSocket.OPEN || !isSessionActive) return;
            turnInFlight = true;
            const msg = {
                realtimeInput: {
                    audio: {
                        data: pcmBase64,
                        mimeType: `audio/pcm;rate=${SEND_SAMPLE_RATE}`
                    }
                }
            };
            geminiWs.send(JSON.stringify(msg));
        }

        // ════════════════════════════════════════════════════════════
        //  Microphone Capture
        // ════════════════════════════════════════════════════════════
        async function startMic() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: SEND_SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                const micCtx = new AudioContext({ sampleRate: SEND_SAMPLE_RATE });
                const source = micCtx.createMediaStreamSource(micStream);

                // Use ScriptProcessorNode (widely supported) for raw PCM
                const processor = micCtx.createScriptProcessor(4096, 1, 1);
                processor.onaudioprocess = (e) => {
                    if (!micActive || !isSessionActive) return;
                    const float32 = e.inputBuffer.getChannelData(0);
                    const int16 = new Int16Array(float32.length);
                    for (let i = 0; i < float32.length; i++) {
                        int16[i] = Math.max(-32768, Math.min(32767, Math.round(float32[i] * 32768)));
                    }
                    const bytes = new Uint8Array(int16.buffer);
                    let binary = '';
                    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                    const base64 = btoa(binary);
                    sendAudioToGemini(base64);
                };
                source.connect(processor);
                processor.connect(micCtx.destination);
                micProcessor = { processor, source, ctx: micCtx };
                micActive = true;
                document.getElementById('micBtn').classList.add('active');
                updateAgentState();
                console.log('[Mic] Started with browser AEC');
            } catch (err) {
                console.error('[Mic] Error:', err);
                alert('Microphone access denied or unavailable.');
            }
        }

        function stopMic() {
            micActive = false;
            updateAgentState();
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (micProcessor) {
                micProcessor.processor.disconnect();
                micProcessor.source.disconnect();
                micProcessor.ctx.close();
                micProcessor = null;
            }
            document.getElementById('micBtn').classList.remove('active');
        }

        // ════════════════════════════════════════════════════════════
        //  NVIDIA Audio2Face (Streaming via NVCF)
        // ════════════════════════════════════════════════════════════
        function connectA2FProxy() {
            if (a2fWs) return;
            console.log('[A2F] Connecting to proxy...');
            a2fWs = new WebSocket(A2F_PROXY_URL);
            a2fWs.onopen = () => {
                console.log('[A2F] Proxy connected (stays open for session)');
                a2fConnected = true;
                updateConnIndicators();
                if (a2fAudioBuffer.length > 0 && !a2fStreamReady) {
                    a2fWs.send(JSON.stringify({ type: 'start' }));
                    a2fStreamReady = true;
                }
                // Pre-warm the gRPC pipeline with a tiny silent audio burst
                // so the NVIDIA service is ready before the user speaks
                _warmupA2FGrpc();
            };
            a2fWs.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === 'header') {
                    a2fBlendshapeNames = msg.blendShapes || [];
                    console.log(`[A2F] Header: ${a2fBlendshapeNames.length} blendshapes`);
                } else if (msg.type === 'animation') {
                    // Queue blendshape frames for synced playback
                    for (const frame of (msg.frames || [])) {
                        const bsDict = {};
                        for (let i = 0; i < Math.min(a2fBlendshapeNames.length, frame.values.length); i++) {
                            bsDict[a2fBlendshapeNames[i]] = frame.values[i];
                        }
                        if (Object.keys(bsDict).length > 0) {
                            a2fBsQueue.push({
                                bsDict,
                                timeCode: frame.timeCode || 0,
                                headRotation: msg.headRotation || null,
                                emotions: msg.emotions || null,
                            });
                        }
                    }
                    // First blendshapes arrived — start audio playback now
                    if (waitingForA2F && a2fBsQueue.length > 0) {
                        startAudioPlayback();
                    }
                    if (!_loggedAnimOnce) {
                        console.log(`[A2F] First animation: ${msg.frames?.length} frames, bsNames=${a2fBlendshapeNames.length}, meshes=${meshesWithMorphs.length}`);
                        if (msg.frames?.[0]) console.log('[A2F] Sample values:', msg.frames[0].values?.slice(0, 5));
                        if (a2fBlendshapeNames.length > 0) console.log('[A2F] Sample names:', a2fBlendshapeNames.slice(0, 5));
                        _loggedAnimOnce = true;
                    }
                    if (msg.headRotation) pendingHeadRotation = msg.headRotation;
                    if (msg.emotions) updateEmotionDisplay(msg.emotions);
                } else if (msg.type === 'status') {
                    console.log(`[A2F] Status: ${msg.message}`);
                } else if (msg.type === 'error') {
                    console.warn('[A2F] Error:', msg.message);
                    a2fConnected = false;
                    a2fStreamReady = false;
                    updateConnIndicators();
                }
            };
            a2fWs.onclose = () => {
                console.log('[A2F] Proxy disconnected');
                a2fWs = null;
                a2fStreamReady = false;
                a2fConnected = false;
                updateConnIndicators();
            };
            a2fWs.onerror = () => { console.warn('[A2F] Proxy WS error'); };
        }

        function startA2FChunkTimer() {
            connectA2FProxy();
            if (a2fSendTimer) return; // already running
            a2fSendTimer = setInterval(() => {
                if (a2fAudioBuffer.length > 0 && a2fWs?.readyState === WebSocket.OPEN) {
                    const chunks = a2fAudioBuffer.splice(0);
                    const totalLen = chunks.reduce((s, c) => s + c.byteLength, 0);
                    const merged = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const c of chunks) {
                        merged.set(new Uint8Array(c), offset);
                        offset += c.byteLength;
                    }
                    let binary = '';
                    for (let i = 0; i < merged.length; i++) binary += String.fromCharCode(merged[i]);
                    a2fWs.send(JSON.stringify({ type: 'audio', data: btoa(binary) }));
                }
            }, A2F_CHUNK_MS);
        }

        function stopA2FChunkTimer() {
            if (a2fSendTimer) { clearInterval(a2fSendTimer); a2fSendTimer = null; }
            // DON'T close the WebSocket — keep it alive
        }

        function flushA2FAudio() {
            if (!a2fWs || a2fWs.readyState !== WebSocket.OPEN) return;
            if (a2fAudioBuffer.length > 0) {
                const chunks = a2fAudioBuffer.splice(0);
                const totalLen = chunks.reduce((s, c) => s + c.byteLength, 0);
                const merged = new Uint8Array(totalLen);
                let offset = 0;
                for (const c of chunks) {
                    merged.set(new Uint8Array(c), offset);
                    offset += c.byteLength;
                }
                let binary = '';
                for (let i = 0; i < merged.length; i++) binary += String.fromCharCode(merged[i]);
                a2fWs.send(JSON.stringify({ type: 'audio', data: btoa(binary) }));
            }
            if (a2fStreamReady) {
                a2fWs.send(JSON.stringify({ type: 'end' }));
                a2fStreamReady = false;
                console.log('[A2F] End of utterance');
            }
        }

        // Pre-warm the A2F gRPC stream so NVIDIA's pipeline is hot before the user's first word.
        // We send ~200ms of silence (9600 samples @ 24kHz, 16-bit = 19200 bytes).
        function _warmupA2FGrpc() {
            if (!a2fWs || a2fWs.readyState !== WebSocket.OPEN) return;
            console.log('[A2F] Sending warmup silence to pre-heat gRPC…');
            const silenceSamples = 9600; // 200 ms @ 24 kHz
            const buf = new Uint8Array(silenceSamples * 2); // 16-bit zeros
            let binary = '';
            for (let i = 0; i < buf.length; i++) binary += String.fromCharCode(buf[i]);
            a2fWs.send(JSON.stringify({ type: 'start' }));
            a2fWs.send(JSON.stringify({ type: 'audio', data: btoa(binary) }));
            a2fWs.send(JSON.stringify({ type: 'end' }));
            // a2fStreamReady stays false — warmup stream is separate from real ones
        }

        // ─── Internet Speed Check ───
        async function checkInternetSpeed() {
            const MIN_MBPS = 1.5;
            const testUrl = `https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js?_=${Date.now()}`;
            try {
                const start = performance.now();
                const response = await fetch(testUrl, { cache: 'no-store' });
                const reader = response.body.getReader();
                let bytesRead = 0;
                const SAMPLE_LIMIT = 300 * 1024; // 300 KB sample
                while (bytesRead < SAMPLE_LIMIT) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    bytesRead += value.length;
                }
                reader.cancel().catch(() => {});
                const elapsed = (performance.now() - start) / 1000;
                if (elapsed < 0.05) return { speedMbps: 99, ok: true };
                const speedMbps = (bytesRead * 8) / (1024 * 1024 * elapsed);
                return { speedMbps, ok: speedMbps >= MIN_MBPS };
            } catch {
                return { speedMbps: null, ok: true }; // can't measure — proceed
            }
        }

        // ════════════════════════════════════════════════════════════
        //  Three.js Avatar Viewer
        // ════════════════════════════════════════════════════════════
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
        // ← Camera position: adjust these to reframe. Current = medium bust shot.
        //   x=0 (centered), y=1.35 (chin height), z=1.8 (distance from avatar)
        camera.position.set(0, 1.35, 1.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        renderer.domElement.addEventListener('dragstart', e => e.preventDefault());

        // HDRI environment lighting (replace flat directional lights)
        // Uses a free studio HDRI from Poly Haven via jsdelivr-cached URL.
        new RGBELoader()
            .load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr', (hdrTexture) => {
                hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = hdrTexture;   // PBR lighting
                // scene.background = hdrTexture; // uncomment to also show HDRI as background
            });
        // Fallback lights kept at low intensity in case HDRI fails to load
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
        keyLight.position.set(1, 2, 2);
        scene.add(keyLight);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.35, 0);  // ← orbit target: keep aligned with camera.y
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minAzimuthAngle = -Math.PI / 4;
        controls.maxAzimuthAngle = Math.PI / 4;
        controls.minPolarAngle = Math.PI / 4;
        controls.maxPolarAngle = 3 * Math.PI / 4;
        controls.update();

        // Avatar
        let avatarLoaded = false;
        let avatarModel = null;
        let meshesWithMorphs = [];
        let headBone = null, neck1Bone = null, neck2Bone = null;
        let headLocator = null, neckLocator = null;  // parent locators for look-at
        let pendingHeadRotation = null;
        let leftEyeBone = null, rightEyeBone = null;
        let leftEyeBaseQuat = null, rightEyeBaseQuat = null;

        // Procedural animation state
        let nextBlinkTime = performance.now() + 2000 + Math.random() * 4000;
        let blinkPhase = 0;
        const BLINK_DURATION = 150;

        let eyeLookAtTarget = new THREE.Vector3(0, 0, 0);
        let eyeLookAtCurrent = new THREE.Vector3(0, 0, 0);
        let nextEyeMove = performance.now() + 2000 + Math.random() * 3000;
        let isSpeaking = false;
        let lastA2FTime = 0;
        let speechIntensity = 0;
        const EYE_SCREEN_TARGET = new THREE.Vector3(0, 1.5, 5);

        let headBaseQuat = null, neck1BaseQuat = null, neck2BaseQuat = null;
        let headTargetQuat = {}, headMicroTime = 0, nextHeadPoseTime = 0, headCurrentQuat = null;

        // AnimationMixer for GLB built-in idle loop
        let avatarMixer = null;
        let mixerClock = new THREE.Clock();

        // ─── Talking blendshape overlay ───────────────────────────
        // While the avatar is speaking, this blendshape is additively applied.
        // Set TALKING_BS_NAME to any morph target in your GLB (e.g. 'mouthSmileLeft').
        // Set TALKING_BS_VALUE to 0 to disable.
        const TALKING_BS_NAME  = 'happy_M';  // ← blendshape to drive while talking
        const TALKING_BS_VALUE = 0.0;              // ← 0.0–1.0 strength

        // The direction the face looks in the HEAD bone's LOCAL space.
        // Adjust if head still looks wrong: (0,0,1)=+Z  (0,0,-1)=-Z  (0,1,0)=+Y  (0,-1,0)=-Y
        const HEAD_LOCAL_FWD = new THREE.Vector3(0, 1, 0);

        function loadAvatar(url) {
            if (avatarLoaded) return; // already in scene — don't add again
            const loader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
            loader.setDRACOLoader(dracoLoader);
            loader.load(url,
                (gltf) => {
                    const model = gltf.scene;
                    avatarModel = model;
                    avatarLoaded = true;
                    scene.add(model);

                    model.traverse((node) => {
                        if (node.isMesh && node.morphTargetInfluences && node.morphTargetDictionary) {
                            meshesWithMorphs.push(node);
                            console.log(`Morph mesh: ${node.name} (${Object.keys(node.morphTargetDictionary).length} shapes)`);
                        }
                        if (!headBone && /^Head_M$/i.test(node.name)) headBone = node;
                        if (!neck1Bone && /^Neck_M$/i.test(node.name)) neck1Bone = node;
                        if (!neck2Bone && /^neck2$/i.test(node.name)) neck2Bone = node;
                        if (!leftEyeBone && node.name === 'EyeJoint_L') { leftEyeBone = node; leftEyeBaseQuat = node.quaternion.clone(); }
                        if (!rightEyeBone && node.name === 'EyeJoint_R') { rightEyeBone = node; rightEyeBaseQuat = node.quaternion.clone(); }
                    });

                    if (headBone) {
                        headBaseQuat = headBone.quaternion.clone();
                        headTargetQuat = headBaseQuat.clone();
                        headCurrentQuat = headBaseQuat.clone();
                        nextHeadPoseTime = performance.now() + 2000 + Math.random() * 3000;
                    }
                    if (neck1Bone) neck1BaseQuat = neck1Bone.quaternion.clone();
                    if (neck2Bone) neck2BaseQuat = neck2Bone.quaternion.clone();

                    // Insert locators after bone discovery so animation tracks still
                    // reference the original bone objects directly.
                    neckLocator = insertLocator(neck1Bone);
                    headLocator = insertLocator(headBone);

                    // Play all GLB animations on a looping mixer
                    console.log('gltf keys:', Object.keys(gltf));
                    console.log('gltf.animations:', gltf.animations);
                    console.log('gltf.scene.animations:', gltf.scene?.animations);

                    // Collect animations from gltf.animations AND from scene nodes
                    let allClips = [...(gltf.animations || [])];
                    model.traverse(node => {
                        if (node.animations && node.animations.length > 0) {
                            console.log(`Found ${node.animations.length} animation(s) on node "${node.name}"`);
                            allClips.push(...node.animations);
                        }
                    });

                    if (allClips.length > 0) {
                        avatarMixer = new THREE.AnimationMixer(model);
                        // Eye look blendshapes we control procedurally — remove from anim clips
                        const eyeLookPattern = /eyeLook|EyeLook|eyeBlink|EyeBlink|EyeJoint/i;
                        allClips.forEach(clip => {
                            clip.tracks = clip.tracks.filter(t => !eyeLookPattern.test(t.name));
                            console.log(`Animation clip: "${clip.name}" duration=${clip.duration.toFixed(3)}s tracks=${clip.tracks.length}`);
                            const action = avatarMixer.clipAction(clip);
                            action.setLoop(THREE.LoopRepeat, Infinity);
                            action.play();
                        });
                        console.log(`Avatar animations: ${allClips.map(a => a.name).join(', ')}`);
                    } else {
                        console.warn('No animations found in GLB!');
                        // Last resort: log full scene structure for debugging
                        model.traverse(n => console.log(`  node: ${n.type} "${n.name}" children=${n.children.length}`));
                    }

                    console.log(`Avatar loaded: ${meshesWithMorphs.length} morph meshes`);
                },
                (progress) => {
                    if (progress.total > 0) {
                        setStatus('connecting', `Loading avatar... ${(progress.loaded / progress.total * 100).toFixed(0)}%`);
                    }
                },
                (error) => {
                    console.error('Avatar load failed:', error);
                    setStatus('disconnected', 'Failed to load avatar.glb');
                }
            );
        }

        // ─── Blendshape Application ───
        const proceduralBlendshapes = new Set([
            'eyeBlinkLeft', 'eyeBlinkRight',
            'eyeLookDownLeft', 'eyeLookDownRight', 'eyeLookUpLeft', 'eyeLookUpRight',
            'eyeLookInLeft', 'eyeLookInRight', 'eyeLookOutLeft', 'eyeLookOutRight',
            'EyeBlinkLeft', 'EyeBlinkRight',
            'EyeLookDownLeft', 'EyeLookDownRight', 'EyeLookUpLeft', 'EyeLookUpRight',
            'EyeLookInLeft', 'EyeLookInRight', 'EyeLookOutLeft', 'EyeLookOutRight',
        ]);
        const emphasisShapes = new Set([
            'jawOpen', 'mouthFunnel', 'mouthPucker', 'mouthShrugUpper',
            'mouthUpperUpLeft', 'mouthUpperUpRight', 'mouthStretchLeft', 'mouthStretchRight',
            'browDownLeft', 'browDownRight', 'browInnerUp',
            'JawOpen', 'MouthFunnel', 'MouthPucker', 'MouthShrugUpper',
            'BrowDownLeft', 'BrowDownRight', 'BrowInnerUp',
        ]);

        let _lastAppliedBsDict = null; // re-applied every frame while speaking to prevent mixer overwrite

        let _loggedApplyOnce = false;
        function applyBlendshapes(bsData) {
            _lastAppliedBsDict = bsData;
            if (!_loggedApplyOnce) {
                const keys = Object.keys(bsData);
                const meshDict = meshesWithMorphs[0]?.morphTargetDictionary;
                const meshKeys = meshDict ? Object.keys(meshDict).slice(0, 5) : [];
                const matched = keys.filter(k => meshDict && (k in meshDict || (k.charAt(0).toLowerCase() + k.slice(1)) in meshDict));
                console.log(`[A2F Apply] bsData keys: ${keys.slice(0,5)}, mesh morph keys: ${meshKeys}, matched: ${matched.length}/${keys.length}`);
                _loggedApplyOnce = true;
            }
            let maxEmphasis = 0;
            for (const [name, value] of Object.entries(bsData)) {
                if (emphasisShapes.has(name) && value > maxEmphasis) maxEmphasis = value;
            }
            speechIntensity = maxEmphasis;

            for (const mesh of meshesWithMorphs) {
                const dict = mesh.morphTargetDictionary;
                const influences = mesh.morphTargetInfluences;
                for (const [name, value] of Object.entries(bsData)) {
                    if (proceduralBlendshapes.has(name)) continue;
                    const camel = name.charAt(0).toLowerCase() + name.slice(1);
                    if (proceduralBlendshapes.has(camel)) continue;
                    const variants = [name, camel];
                    for (const v of variants) {
                        if (v in dict) { influences[dict[v]] = value; break; }
                    }
                }
            }
        }

        // Look-at via parent locators: rotate an Object3D that sits between
        // bone.parent and bone. The AnimationMixer drives the bone itself and
        // never touches the locator, so there is zero interference at loop seams.
        let headLookYaw = 0, headLookPitch = 0;
        function setLocatorLookAt(locator, yaw, pitch, weight) {
            if (!locator) return;
            const e = new THREE.Euler(yaw * weight, 0, -pitch * weight, 'YXZ');
            locator.quaternion.setFromEuler(e);
        }

        function insertLocator(bone) {
            if (!bone || !bone.parent) return null;
            const locator = new THREE.Object3D();
            locator.name = bone.name + '_locator';
            const parent = bone.parent;
            parent.remove(bone);
            parent.add(locator);
            locator.add(bone);
            return locator;
        }

        const EMOTION_EMOJI = {
            amazement: '😲', anger: '😠', cheekiness: '😏', disgust: '🤢',
            fear: '😨', grief: '😢', joy: '😄', outofbreath: '😤',
            pain: '😣', sadness: '😔', happiness: '😄', surprise: '😲',
            contempt: '😒', neutral: '😐',
        };

        // Fixed display order for emotions
        const EMOTION_ORDER = ['joy','happiness','amazement','surprise','cheekiness',
                               'anger','contempt','disgust','fear','grief','sadness','pain','outofbreath','neutral'];

        // One consistent colour per emotion slot
        const EMO_COLORS = {
            joy:'#ffee58', happiness:'#ffd54f', amazement:'#26c6da', surprise:'#42a5f5',
            cheekiness:'#ab47bc', anger:'#ef5350', contempt:'#ff7043', disgust:'#8d6e63',
            fear:'#7e57c2', grief:'#78909c', sadness:'#64b5f6', pain:'#ec407a',
            outofbreath:'#ff9800', neutral:'#bdbdbd',
        };

        // Build static rows once; update widths on each call
        function initEmotionPanel() {
            const badge = document.getElementById('emotionBadge');
            badge.innerHTML = EMOTION_ORDER.map(n => {
                const emoji = EMOTION_EMOJI[n] || '🎭';
                const color = EMO_COLORS[n] || '#4caf50';
                return `<div class="emo-row">
                    <span class="emo-icon">${emoji}</span>
                    <span class="emo-name">${n}</span>
                    <div class="emo-bar-wrap"><div class="emo-bar" id="emo-bar-${n}" style="width:0%;background:${color}"></div></div>
                    <span class="emo-pct" id="emo-pct-${n}">0.0</span>
                </div>`;
            }).join('');
        }

        function resetEmotionPanel() {
            for (const n of EMOTION_ORDER) {
                const bar = document.getElementById(`emo-bar-${n}`);
                const lbl = document.getElementById(`emo-pct-${n}`);
                if (bar) bar.style.width = '0%';
                if (lbl) lbl.textContent = '0.0';
            }
        }

        function updateEmotionDisplay(emotions) {
            if (!emotions) return;
            // Debug info panel
            document.getElementById('emotions').innerHTML = Object.entries(emotions)
                .sort((a, b) => b[1] - a[1])
                .map(([n, v]) => `<div>${n}: ${'█'.repeat(Math.round(v))} ${v.toFixed(2)}</div>`)
                .join('');
            // Update each bar in-place — values are 0-10, bar is 0-100%
            for (const n of EMOTION_ORDER) {
                const v = emotions[n] || 0;
                const bar = document.getElementById(`emo-bar-${n}`);
                const lbl = document.getElementById(`emo-pct-${n}`);
                if (bar) bar.style.width = `${Math.min(v * 10, 100)}%`;
                if (lbl) lbl.textContent = v.toFixed(2);
            }
        }

        // ─── Animation Loop ───
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = mixerClock.getDelta();
            if (avatarMixer) avatarMixer.update(delta);

            // Re-apply the last A2F blendshape frame every render frame while speaking.
            // The idle AnimationMixer can include mouth/jaw tracks; without this, it
            // overwrites A2F values on frames where no new A2F frame is due, causing flicker.
            if (isSpeaking && _lastAppliedBsDict) applyBlendshapes(_lastAppliedBsDict);

            // Blink
            if (now >= nextBlinkTime && blinkPhase === 0) blinkPhase = now;
            let blinkVal = 0;
            if (blinkPhase > 0) {
                const elapsed = now - blinkPhase;
                if (elapsed < BLINK_DURATION / 2) blinkVal = elapsed / (BLINK_DURATION / 2);
                else if (elapsed < BLINK_DURATION) blinkVal = 1 - (elapsed - BLINK_DURATION / 2) / (BLINK_DURATION / 2);
                else { blinkPhase = 0; nextBlinkTime = now + 2000 + Math.random() * 4000; }
            }

            // Apply A2F blendshape frames synced to audio elapsed time
            if (a2fBsQueue.length > 0 && audioStartTime !== null) {
                const elapsed = (now - audioStartTime) / 1000; // seconds
                let lastFrame = null;
                while (a2fBsQueue.length > 0 && a2fBsQueue[0].timeCode <= elapsed) {
                    lastFrame = a2fBsQueue.shift();
                }
                if (lastFrame) {
                    applyBlendshapes(lastFrame.bsDict);
                    lastA2FTime = now;
                    if (!isSpeaking) { isSpeaking = true; updateAgentState(); }
                    if (lastFrame.headRotation) pendingHeadRotation = lastFrame.headRotation;
                    if (lastFrame.emotions) updateEmotionDisplay(lastFrame.emotions);
                }
            }

            // Also: if we've been waiting too long for A2F (>1s), start audio anyway
            if (waitingForA2F && playbackQueue.length > 0 && audioStartTime === null) {
                if (!_a2fWaitStart) _a2fWaitStart = now;
                if (now - _a2fWaitStart > 1000) {
                    console.log('[Sync] Timeout waiting for A2F, starting audio without lipsync');
                    startAudioPlayback();
                    _a2fWaitStart = null;
                }
            } else {
                _a2fWaitStart = null;
            }

            if (isSpeaking && now - lastA2FTime > 500) {
                isSpeaking = false;
                _lastAppliedBsDict = null; // allow decay to take over
                // Reset for next utterance
                audioStartTime = null;
                a2fBsQueue.length = 0;
                updateAgentState();
                // Reset emotions to zero after speaking ends
                resetEmotionPanel();
            }

            // Decay mouth blendshapes to zero when idle
            if (!isSpeaking && now - lastA2FTime > 200) {
                const decay = Math.min(1, (now - lastA2FTime - 200) / 300); // 0→1 over 300ms
                for (const mesh of meshesWithMorphs) {
                    const dict = mesh.morphTargetDictionary;
                    const inf = mesh.morphTargetInfluences;
                    for (const name of Object.keys(dict)) {
                        if (proceduralBlendshapes.has(name)) continue;
                        const idx = dict[name];
                        inf[idx] *= (1 - decay * 0.15); // smooth decay per frame
                    }
                }
            }

            // Eye & head look-at
            let camGazeX = 0, camGazeY = 0;
            {
                const avatarPos = new THREE.Vector3(0, 1.5, 0);
                const diff = new THREE.Vector3().subVectors(camera.position, avatarPos);
                camGazeX = Math.atan2(diff.x, diff.z);
                const horizDist = Math.sqrt(diff.x * diff.x + diff.z * diff.z);
                camGazeY = Math.atan2(diff.y, horizDist);
            }

            if (isSpeaking) {
                eyeLookAtTarget.set(camGazeX, camGazeY, 0);
            } else {
                if (now >= nextEyeMove) {
                    eyeLookAtTarget._idleOffX = (Math.random() - 0.5) * 0.3;
                    eyeLookAtTarget._idleOffY = (Math.random() - 0.5) * 0.2;
                    nextEyeMove = now + 1500 + Math.random() * 3000;
                }
                eyeLookAtTarget.set(camGazeX + (eyeLookAtTarget._idleOffX || 0), camGazeY + (eyeLookAtTarget._idleOffY || 0), 0);
            }
            eyeLookAtCurrent.lerp(eyeLookAtTarget, 0.4);

            const lx = -eyeLookAtCurrent.x, ly = eyeLookAtCurrent.y;

            // ARKit eye blendshapes
            // lx > 0 = camera to avatar's RIGHT → both eyes look RIGHT
            //   left eye  RIGHT = eyeLookInLeft  (converging toward nose)
            //   right eye RIGHT = eyeLookOutRight (diverging away from nose)
            // lx < 0 = camera to avatar's LEFT → both eyes look LEFT
            //   left eye  LEFT = eyeLookOutLeft  (diverging)
            //   right eye LEFT = eyeLookInRight  (converging)
            for (const mesh of meshesWithMorphs) {
                const dict = mesh.morphTargetDictionary;
                const inf = mesh.morphTargetInfluences;
                if ('eyeBlinkLeft'  in dict) inf[dict['eyeBlinkLeft']]  = blinkVal;
                if ('eyeBlinkRight' in dict) inf[dict['eyeBlinkRight']] = blinkVal;
                // Also try uppercase variants
                if ('EyeBlinkLeft'  in dict) inf[dict['EyeBlinkLeft']]  = blinkVal;
                if ('EyeBlinkRight' in dict) inf[dict['EyeBlinkRight']] = blinkVal;

                // Helper to set a morph by name (tries both casings)
                const setMorph = (name, val) => {
                    if (name in dict) inf[dict[name]] = val;
                    else {
                        const alt = name.charAt(0).toUpperCase() + name.slice(1);
                        if (alt in dict) inf[dict[alt]] = val;
                    }
                };
                if (lx > 0) {
                    setMorph('eyeLookInLeft', lx);
                    setMorph('eyeLookOutRight', lx);
                    setMorph('eyeLookOutLeft', 0);
                    setMorph('eyeLookInRight', 0);
                } else {
                    setMorph('eyeLookOutLeft', -lx);
                    setMorph('eyeLookInRight', -lx);
                    setMorph('eyeLookInLeft', 0);
                    setMorph('eyeLookOutRight', 0);
                }
                if (ly > 0) {
                    setMorph('eyeLookUpLeft', ly);
                    setMorph('eyeLookUpRight', ly);
                    setMorph('eyeLookDownLeft', 0);
                    setMorph('eyeLookDownRight', 0);
                } else {
                    setMorph('eyeLookDownLeft', -ly);
                    setMorph('eyeLookDownRight', -ly);
                    setMorph('eyeLookUpLeft', 0);
                    setMorph('eyeLookUpRight', 0);
                }
            }

            // Eye bone look-at (reset to base, then apply offset)
            if (leftEyeBone && leftEyeBaseQuat) {
                leftEyeBone.quaternion.copy(leftEyeBaseQuat);
                const e = new THREE.Euler().setFromQuaternion(leftEyeBone.quaternion, 'ZYX');
                e.y -= lx * 0.5;
                e.x -= ly * 0.5;
                leftEyeBone.quaternion.setFromEuler(e);
            }
            if (rightEyeBone && rightEyeBaseQuat) {
                rightEyeBone.quaternion.copy(rightEyeBaseQuat);
                const e = new THREE.Euler().setFromQuaternion(rightEyeBone.quaternion, 'ZYX');
                e.y -= lx * 0.5;
                e.x -= ly * 0.5;
                rightEyeBone.quaternion.setFromEuler(e);
            }

            // Head/neck look-at — drive the locators, not the bones
            {
                const yaw = camGazeX * 0.5;
                const pitch = camGazeY * 0.3;
                setLocatorLookAt(neckLocator, yaw, pitch, 0.4);
                setLocatorLookAt(headLocator, yaw, pitch, 0.6);
            }

            // Talking blendshape floor (while speaking)
            // Uses Math.max so A2F emotion values can exceed it freely;
            // it only acts as a minimum floor — never fights A2F data.
            if (TALKING_BS_VALUE > 0 && isSpeaking) {
                for (const mesh of meshesWithMorphs) {
                    const dict = mesh.morphTargetDictionary;
                    const inf  = mesh.morphTargetInfluences;
                    const idx  = dict[TALKING_BS_NAME] ?? dict[TALKING_BS_NAME.charAt(0).toLowerCase() + TALKING_BS_NAME.slice(1)];
                    if (idx !== undefined) {
                        inf[idx] = Math.max(inf[idx], TALKING_BS_VALUE);
                    }
                }
            }

            controls.update();

            // Debug
            const debugEl = document.getElementById('debug');
            if (debugEl && meshesWithMorphs.length > 0) {
                const m0 = meshesWithMorphs[0];
                const dict = m0.morphTargetDictionary;
                const inf = m0.morphTargetInfluences;
                debugEl.textContent = [
                    `meshes: ${meshesWithMorphs.length}`,
                    `headBone: ${headBone ? headBone.name : 'NONE'}`,
                    `eyes: L=${leftEyeBone ? 'yes' : 'no'} R=${rightEyeBone ? 'yes' : 'no'}`,
                    `blink: ${blinkVal.toFixed(3)}`,
                    `speaking: ${isSpeaking}`,
                    `gemini: ${geminiWs?.readyState === WebSocket.OPEN ? 'connected' : 'disconnected'}`,
                    `mic: ${micActive ? 'on' : 'off'}`,
                ].join('\n');
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ════════════════════════════════════════════════════════════
        //  UI Event Handlers
        // ════════════════════════════════════════════════════════════
        document.getElementById('startBtn').addEventListener('click', async () => {
            const password = document.getElementById('cfgPassword').value;
            const errEl    = document.getElementById('passwordError');
            const btn      = document.getElementById('startBtn');
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Unlocking…';

            const apiKey = await decryptApiKey(password);
            if (!apiKey || !apiKey.startsWith('AI')) {
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Unlock &amp; Connect';
                return;
            }

            config = { googleKey: apiKey };
            document.getElementById('configPanel').classList.add('hidden');
            document.getElementById('connOverlay').classList.add('visible');
            document.getElementById('topBar').style.display = 'flex';
            document.getElementById('controls').style.display = 'flex';
            setStatus('', 'కనెక్ట్ అవుతున్నాం...');

            // ─── Start A2F + avatar immediately (in parallel with speed check) ───
            if (!avatarLoaded) loadAvatar('avatar.glb');
            initEmotionPanel(); // build static emotion rows
            connectA2FProxy(); // warms up gRPC while speed check runs

            // ─── Internet speed check (runs concurrently with A2F warmup) ───
            const rowSpeed = document.getElementById('rowSpeed');
            const rowSpeedText = document.getElementById('rowSpeedText');
            rowSpeedText.textContent = 'Checking internet speed…';
            const { speedMbps, ok: speedOk } = await checkInternetSpeed();
            if (speedMbps !== null) {
                rowSpeedText.textContent = `Internet speed: ${speedMbps.toFixed(1)} Mbps`;
            } else {
                rowSpeedText.textContent = 'Speed check skipped';
            }
            rowSpeed.classList.add('done');

            if (!speedOk && speedMbps !== null) {
                const proceed = confirm(
                    `Your internet speed is ${speedMbps.toFixed(1)} Mbps.\n` +
                    `This app works best above 1.5 Mbps. You may experience audio drops or lag.\n\n` +
                    `Do you want to continue anyway?`
                );
                if (!proceed) {
                    if (a2fWs) { a2fWs.close(); a2fWs = null; }
                    document.getElementById('connOverlay').classList.remove('visible');
                    document.getElementById('configPanel').classList.remove('hidden');
                    document.getElementById('topBar').style.display = 'none';
                    document.getElementById('controls').style.display = 'none';
                    rowSpeed.classList.remove('done');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Unlock &amp; Connect';
                    return;
                }
            }

            connectGemini();
        });

        document.getElementById('cfgPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('startBtn').click();
        });

        document.getElementById('micBtn').addEventListener('click', () => {
            if (micActive) {
                stopMic();
                document.getElementById('micBtn').innerHTML = '<i class="fa-solid fa-microphone"></i>';
            } else {
                startMic();
                document.getElementById('micBtn').innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
            }
        });

        function endSession() {
            // Stop all audio immediately before anything else
            stopAllAudio();
            a2fBsQueue.length = 0;
            a2fAudioBuffer.length = 0;
            audioStartTime = null;
            waitingForA2F = false;
            isSpeaking = false;

            if (geminiWs) { geminiWs.close(); geminiWs = null; }
            stopMic();
            isSessionActive = false;
            turnInFlight = false;
            agentState = 'idle';
            renderAgentStateUI();
            document.getElementById('agentStateIndicator').style.display = 'none';
            document.getElementById('statusText').style.display = '';
            resetEmotionPanel();
            stopA2FChunkTimer();
            // Keep A2F WebSocket open — it stays warm for next session
            // Just reset stream state
            if (a2fStreamReady && a2fWs?.readyState === WebSocket.OPEN) {
                try { a2fWs.send(JSON.stringify({ type: 'end' })); } catch {}
            }
            a2fStreamReady = false;
            geminiConnected = false;
            // a2fConnected stays true if socket is still open
            greetingSent = false;
            document.getElementById('rowGemini').classList.remove('done');
            document.getElementById('rowSpeed').classList.remove('done');
            // Keep rowA2F as done if socket is still alive
            if (!a2fConnected) document.getElementById('rowA2F').classList.remove('done');
            document.getElementById('configPanel').classList.remove('hidden');
            document.getElementById('connOverlay').classList.remove('visible');
            document.getElementById('topBar').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('infoPanel').style.display = 'none';
            document.getElementById('micBtn').innerHTML = '<i class="fa-solid fa-microphone"></i>';
            // Reset password field and unlock button
            document.getElementById('cfgPassword').value = '';
            document.getElementById('passwordError').style.display = 'none';
            const btn = document.getElementById('startBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Unlock &amp; Connect';
            setStatus('', '');
        }

        document.getElementById('endBtn').addEventListener('click', endSession);

        document.getElementById('infoBtn').addEventListener('click', () => {
            const panel = document.getElementById('infoPanel');
            const btn   = document.getElementById('infoBtn');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                btn.classList.remove('active');
            } else {
                panel.style.display = 'block';
                btn.classList.add('active');
            }
        });
    </script>
</body>
</html>
