<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Debug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            overflow: hidden;
            font-family: monospace;
            color: #fff;
        }

        canvas {
            display: block;
        }

        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.8;
            min-width: 220px;
        }

        #hud h3 {
            font-size: 13px;
            margin-bottom: 6px;
            color: #4caf50;
        }

        #hud .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        #hud .label {
            color: #8899aa;
        }

        #hud .val {
            color: #fff;
        }

        #controls {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #1e3a1e;
            color: #4caf50;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #2e5a2e;
        }

        button.active {
            background: #4caf50;
            color: #000;
        }

        #morphPanel {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 11px;
            max-height: 90vh;
            overflow-y: auto;
            min-width: 200px;
        }

        #morphPanel h3 {
            color: #42a5f5;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .morph-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .morph-row label {
            width: 140px;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .morph-row input[type=range] {
            width: 80px;
            accent-color: #42a5f5;
        }

        .morph-row .morph-val {
            width: 30px;
            color: #fff;
            text-align: right;
        }

        #loadStatus {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #8899aa;
        }

        #hud .viseme-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #visemeTrack {
            flex: 1;
            height: 6px;
            background: #1a2a1a;
            border-radius: 3px;
            overflow: hidden;
        }

        #visemeFill {
            height: 100%;
            width: 0%;
            background: #ff9800;
            border-radius: 3px;
            transition: width 0.05s linear;
        }

        button.audio-btn {
            background: #1e1e3a;
            color: #42a5f5;
        }

        button.audio-btn:hover {
            background: #2e2e5a;
        }

        button.audio-btn.active {
            background: #42a5f5;
            color: #000;
        }

        #visemePanel {
            position: fixed;
            top: 10px;
            left: 250px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.82);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 11px;
            max-height: 90vh;
            overflow-y: auto;
            min-width: 320px;
            display: none;
        }

        #visemePanel h3 {
            color: #ff9800;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .vp-global {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #333;
        }

        .vp-global label {
            color: #aaa;
            min-width: 90px;
        }

        .vp-global input[type=range] {
            width: 90px;
            accent-color: #ff9800;
        }

        .vp-global .vp-val {
            color: #fff;
            min-width: 32px;
            text-align: right;
        }

        .vp-viseme {
            margin-bottom: 6px;
        }

        .vp-viseme-name {
            color: #ff9800;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .vp-bs-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            padding-left: 8px;
        }

        .vp-bs-row label {
            color: #8899aa;
            width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vp-bs-row input[type=range] {
            width: 80px;
            accent-color: #42a5f5;
        }

        .vp-bs-row .vp-val {
            color: #fff;
            min-width: 32px;
            text-align: right;
        }

        .vp-bs-row input[type=checkbox] {
            accent-color: #ff9800;
        }
    </style>
</head>

<body>

    <div id="loadStatus">Loading avatar.glb…</div>

    <!-- HUD -->
    <div id="hud">
        <h3>Avatar Debug</h3>
        <div class="row"><span class="label">meshes</span><span class="val" id="s-meshes">-</span></div>
        <div class="row"><span class="label">headBone</span><span class="val" id="s-head">-</span></div>
        <div class="row"><span class="label">neck</span><span class="val" id="s-neck">-</span></div>
        <div class="row"><span class="label">eyes L/R</span><span class="val" id="s-eyes">-</span></div>
        <div class="row"><span class="label">animations</span><span class="val" id="s-anims">-</span></div>
        <div class="row"><span class="label">mixer time</span><span class="val" id="s-time">-</span></div>
        <div class="row"><span class="label">blink</span><span class="val" id="s-blink">-</span></div>
        <div class="row"><span class="label">look-at</span><span class="val" id="s-lookat">-</span></div>
        <div class="row"><span class="label">viseme</span><span class="val" id="s-viseme">sil</span></div>
        <div class="row viseme-bar"><span class="label">jaw</span>
            <div id="visemeTrack">
                <div id="visemeFill"></div>
            </div>
        </div>
    </div>

    <!-- Viseme tuning panel (populated after load) -->
    <div id="visemePanel">
        <h3>Viseme Editor</h3>
        <div class="vp-global">
            <label>Jaw Scale</label>
            <input type="range" id="vpJawScale" min="0" max="1" step="0.01" value="0.5">
            <span class="vp-val" id="vpJawScaleVal">0.50</span>
        </div>
        <div class="vp-global">
            <label>Head Audio</label>
            <input type="range" id="vpHeadStrength" min="0" max="1" step="0.01" value="0.3">
            <span class="vp-val" id="vpHeadStrengthVal">0.30</span>
        </div>
        <div class="vp-global">
            <label>Smooth Speed</label>
            <input type="range" id="vpSmoothSpeed" min="0.02" max="0.6" step="0.01" value="0.18">
            <span class="vp-val" id="vpSmoothSpeedVal">0.18</span>
        </div>
        <div class="vp-global">
            <label>Anticipation</label>
            <input type="range" id="vpAnticipation" min="0" max="1" step="0.01" value="0.35">
            <span class="vp-val" id="vpAnticipationVal">0.35</span>
        </div>
        <div class="vp-global">
            <label>Brow Strength</label>
            <input type="range" id="vpBrowStrength" min="0" max="1" step="0.01" value="0.5">
            <span class="vp-val" id="vpBrowStrengthVal">0.50</span>
        </div>
        <div id="vpVisemeList"><em style="color:#666">Loading…</em></div>
    </div>

    <!-- Morph target panel (populated after load) -->
    <div id="morphPanel">
        <h3>Morph Targets</h3>
        <div id="morphList"><em style="color:#666">Loading…</em></div>
    </div>

    <!-- Controls -->
    <div id="controls">
        <button id="btnLookAt" class="active" title="Toggle head/eye look-at">Look-at ON</button>
        <button id="btnBlink" class="active" title="Toggle blink">Blink ON</button>
        <button id="btnAnim" class="active" title="Toggle idle animation">Anim ON</button>
        <button id="btnPause" title="Pause / Resume render">Pause</button>
        <button id="btnReload" title="Reload avatar.glb">Reload GLB</button>
        <button id="btnAudio" class="audio-btn" title="Play/pause audio.mp3 lipsync">▶ Audio</button>
        <button id="btnVisemeEditor" class="audio-btn" title="Toggle viseme editor">Viseme Editor</button>
    </div>

    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ════════════════════════════════════════════════════════════
        //  Scene
        // ════════════════════════════════════════════════════════════
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        // ═══════════════════════════════════════════════════════════════
        //  CAMERA — synced with index.html CAMERA_ constants
        // ═══════════════════════════════════════════════════════════════
        const CAMERA_FOV = 30;
        const CAMERA_X = 0;
        const CAMERA_Y = 1.5;
        const CAMERA_Z = 2.6;
        const CAMERA_LOOK_Y = 1.28;

        const camera = new THREE.PerspectiveCamera(CAMERA_FOV, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(CAMERA_X, CAMERA_Y, CAMERA_Z);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        renderer.domElement.addEventListener('dragstart', e => e.preventDefault());

        new RGBELoader().load(
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
            (hdr) => { hdr.mapping = THREE.EquirectangularReflectionMapping; scene.environment = hdr; }
        );
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
        keyLight.position.set(1, 2, 2);
        scene.add(keyLight);

        // Controls — locked to match index.html (no user drag/zoom)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, CAMERA_LOOK_Y, 0);
        controls.enabled = false;  // locked — edit CAMERA_ constants above to reframe
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ════════════════════════════════════════════════════════════
        //  Avatar state (mirrors index.html)
        // ════════════════════════════════════════════════════════════
        let avatarLoaded = false, avatarModel = null, meshesWithMorphs = [];
        let headBone = null, neck1Bone = null;
        let headLocator = null, neckLocator = null;  // parent locators for look-at
        let leftEyeBone = null, rightEyeBone = null;
        let leftEyeBaseQuat = null, rightEyeBaseQuat = null;
        let avatarMixer = null;
        const mixerClock = new THREE.Clock();

        // Procedural state
        let nextBlinkTime = performance.now() + 2000 + Math.random() * 4000;
        let blinkPhase = 0;
        const BLINK_DURATION = 150;
        const eyeLookAtTarget = new THREE.Vector3();
        const eyeLookAtCurrent = new THREE.Vector3();
        let nextEyeMove = performance.now() + 2000 + Math.random() * 3000;

        // Feature toggles
        let lookAtEnabled = true;
        let blinkEnabled = true;
        let animEnabled = true;
        let paused = false;

        // Manual morph overrides (set via sliders)
        const morphOverrides = {}; // name → value 0-1

        // ─── Default Smile (synced with index.html) ─────────────
        const IDLE_SMILE_SHAPES = {
            'mouthSmileLeft': 0.55,
            'mouthSmileRight': 0.55,
        };
        const SPEAKING_SMILE_SHAPES = {
            'mouthSmileLeft': 0.35,
            'mouthSmileRight': 0.35,
        };

        // ════════════════════════════════════════════════════════════
        //  Audio / Viseme state
        // ════════════════════════════════════════════════════════════
        let audioCtx = null, analyser = null, freqData = null;
        let audioElement = null;
        let audioEnabled = false;

        // Current smoothed blendshape weights driven by audio (separate from morphOverrides)
        const visemeWeights = {};
        let visemeSmooth = 0.18;     // lerp factor — lower = smoother (user-controlled)
        let anticipation = 0.35;   // how much rising energy overshoots target
        let browStrength = 0.5;    // eyebrow raise amplitude

        // Ring buffer for energy trend (anticipation)
        const TREND_FRAMES = 4;
        const energyRing = new Array(TREND_FRAMES).fill(0);
        let energyRingIdx = 0;
        let smoothedBrow = 0;    // smoothed brow weight

        // Tunable parameters (driven by viseme editor UI)
        let jawScale = 0.5;          // multiplier on jawOpen for all visemes
        let headAudioStrength = 0.3; // how much audio drives head movement
        let smoothedRms = 0;         // exponentially smoothed overall volume
        let headAudioPitch = 0;      // current head pitch offset from audio

        // Per-viseme per-blendshape weight overrides (populated by buildVisemePanel)
        // visemeOverrides[visemeName][bsName] = float 0-2
        const visemeOverrides = {};

        // Viseme label → ARKit blendshape weights
        // Each entry maps to blendshape names (ARKit standard, lowercase)
        const VISEME_SHAPES = {
            sil: { jawOpen: 0.00, mouthClose: 0.25 },
            PP: { jawOpen: 0.00, mouthClose: 0.80, mouthRollLower: 0.30 },
            FF: { jawOpen: 0.10, mouthLowerDownLeft: 0.45, mouthLowerDownRight: 0.45 },
            DD: { jawOpen: 0.18, mouthClose: 0.20 },
            CH: { jawOpen: 0.22, mouthFunnel: 0.45, mouthStretchLeft: 0.20, mouthStretchRight: 0.20 },
            SS: { jawOpen: 0.08, mouthStretchLeft: 0.35, mouthStretchRight: 0.35, mouthDimpleLeft: 0.15, mouthDimpleRight: 0.15 },
            aa: { jawOpen: 0.72, mouthLowerDownLeft: 0.55, mouthLowerDownRight: 0.55, mouthUpperUpLeft: 0.20, mouthUpperUpRight: 0.20 },
            E: { jawOpen: 0.42, mouthSmileLeft: 0.40, mouthSmileRight: 0.40, mouthStretchLeft: 0.25, mouthStretchRight: 0.25 },
            O: { jawOpen: 0.52, mouthFunnel: 0.65, mouthRollLower: 0.10 },
            U: { jawOpen: 0.18, mouthPucker: 0.72, mouthFunnel: 0.38 },
        };

        // Collect all unique blendshape names used across all visemes
        const ALL_VISEME_BS = [...new Set(Object.values(VISEME_SHAPES).flatMap(v => Object.keys(v)))];
        // Initialise smoothed weights to 0
        ALL_VISEME_BS.forEach(n => visemeWeights[n] = 0);

        // ────────────────────────────────────────────────────────────
        //  Initialise Web Audio analyser from <audio> element
        // ────────────────────────────────────────────────────────────
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new AudioContext();
            audioElement = new Audio('audio.mp3');
            audioElement.loop = true;
            audioElement.crossOrigin = 'anonymous';
            const source = audioCtx.createMediaElementSource(audioElement);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.5;
            freqData = new Uint8Array(analyser.frequencyBinCount); // 1024 bins
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        // ────────────────────────────────────────────────────────────
        //  Compute band energy (average dB-ish value 0–1) for a Hz range
        // ────────────────────────────────────────────────────────────
        function bandEnergy(loHz, hiHz) {
            const sr = audioCtx.sampleRate;
            const binHz = sr / analyser.fftSize;
            const loBin = Math.max(0, Math.floor(loHz / binHz));
            const hiBin = Math.min(freqData.length - 1, Math.ceil(hiHz / binHz));
            let sum = 0;
            for (let i = loBin; i <= hiBin; i++) sum += freqData[i];
            return sum / ((hiBin - loBin + 1) * 255);
        }

        // ────────────────────────────────────────────────────────────
        //  Classify current FFT frame into a viseme label + jaw weight
        // ────────────────────────────────────────────────────────────
        function classifyViseme() {
            analyser.getByteFrequencyData(freqData);

            const rms = bandEnergy(80, 8000);
            const f1 = bandEnergy(250, 800);   // formant 1  → jaw openness
            const f2 = bandEnergy(800, 2500);   // formant 2  → front/back tongue
            const sib = bandEnergy(3000, 8000);  // sibilants  → s/z/sh
            const labial = bandEnergy(80, 250);   // bilabials  → p/b/m fundamental
            const midConst = bandEnergy(2500, 3500);  // ch/sh region

            if (rms < 0.035) return { viseme: 'sil', jaw: 0 };

            // Sibilants dominate → SS or CH
            if (sib > 0.25) {
                if (midConst > 0.20) return { viseme: 'CH', jaw: sib * 0.4 };
                return { viseme: 'SS', jaw: sib * 0.3 };
            }

            // Very low labial energy, low F1 → bilabial stop
            if (labial > 0.28 && f1 < 0.15) return { viseme: 'PP', jaw: 0.02 };

            // Fricative FF: f2 moderate, f1 low
            if (f2 > 0.20 && f1 < 0.18 && sib < 0.18) return { viseme: 'FF', jaw: f2 * 0.25 };

            // Vowel classification by F1 / F2 ratio
            const jaw = Math.min(1, f1 * 2.2);
            if (f1 > 0.25) {
                // Open vowel
                const ratio = f2 / (f1 + 0.001);
                if (ratio > 1.6) return { viseme: 'E', jaw };
                if (ratio < 0.7) return { viseme: 'U', jaw: jaw * 0.6 };
                return { viseme: 'aa', jaw };
            }
            if (f1 > 0.12) {
                const ratio = f2 / (f1 + 0.001);
                if (ratio > 1.8) return { viseme: 'E', jaw: jaw * 0.8 };
                if (ratio < 0.9) return { viseme: 'O', jaw: jaw * 0.9 };
                return { viseme: 'DD', jaw: jaw * 0.6 };
            }

            return { viseme: 'DD', jaw: 0.1 };
        }

        // ────────────────────────────────────────────────────────────
        //  Compute target blendshape weights for current frame and
        //  smooth into visemeWeights[]
        // ────────────────────────────────────────────────────────────
        function updateVisemeWeights() {
            if (!audioEnabled || !analyser) {
                for (const k of ALL_VISEME_BS) visemeWeights[k] = visemeWeights[k] * (1 - visemeSmooth);
                smoothedRms += (0 - smoothedRms) * 0.1;
                smoothedBrow += (0 - smoothedBrow) * 0.08;
                return 'sil';
            }
            const { viseme, jaw } = classifyViseme();
            const base = VISEME_SHAPES[viseme];
            const overrides = visemeOverrides[viseme] || {};

            // RMS for head + brow
            const rms = bandEnergy(80, 8000);
            smoothedRms += (rms - smoothedRms) * 0.15;

            // Energy trend for anticipation — compare current vs recent average
            energyRing[energyRingIdx % TREND_FRAMES] = rms;
            energyRingIdx++;
            const avgPast = energyRing.reduce((s, v) => s + v, 0) / TREND_FRAMES;
            const trend = Math.max(0, rms - avgPast); // positive = rising energy
            const anticipationBoost = trend * anticipation * 3.0; // overshoot scaler

            for (const name of ALL_VISEME_BS) {
                const mult = overrides[name] ?? 1.0;
                const rawVal = (base[name] ?? 0) * mult;
                const t = name === 'jawOpen' ? rawVal * jawScale : rawVal;
                // Anticipation: when energy is rising, overshoot slightly
                const boosted = Math.min(1, t + anticipationBoost * t);
                visemeWeights[name] += (boosted - visemeWeights[name]) * visemeSmooth;
            }
            // Jaw driven from classifier, scaled + anticipation
            const jawTarget = Math.min(1, jaw * jawScale * (1 + anticipationBoost));
            visemeWeights['jawOpen'] += (jawTarget - visemeWeights['jawOpen']) * visemeSmooth;

            // Brow — smoothly tracks RMS
            const browTarget = Math.min(1, smoothedRms * browStrength * 3.5);
            smoothedBrow += (browTarget - smoothedBrow) * 0.12;

            return viseme;
        }

        // ════════════════════════════════════════════════════════════
        //  Look-at: set rotation on a locator Object3D
        //  The locator sits between the bone's parent and the bone;
        //  the AnimationMixer drives the bone itself — never the locator.
        // ════════════════════════════════════════════════════════════
        function setLocatorLookAt(locator, yaw, pitch, weight) {
            if (!locator) return;
            const e = new THREE.Euler(yaw * weight, 0, -pitch * weight, 'YXZ');
            locator.quaternion.setFromEuler(e);
        }

        // Insert an Object3D locator between bone.parent and bone.
        // Returns the new locator, or null if bone/parent is missing.
        function insertLocator(bone) {
            if (!bone || !bone.parent) return null;
            const locator = new THREE.Object3D();
            locator.name = bone.name + '_locator';
            const parent = bone.parent;
            parent.remove(bone);
            parent.add(locator);
            locator.add(bone);
            return locator;
        }

        // ════════════════════════════════════════════════════════════
        //  GLB Loader
        // ════════════════════════════════════════════════════════════
        function loadAvatar() {
            if (avatarModel) { scene.remove(avatarModel); avatarModel = null; }
            avatarLoaded = false; meshesWithMorphs = [];
            headBone = neck1Bone = leftEyeBone = rightEyeBone = null;
            headLocator = neckLocator = null;
            leftEyeBaseQuat = rightEyeBaseQuat = null;
            avatarMixer = null;
            document.getElementById('morphList').innerHTML = '<em style="color:#666">Loading…</em>';
            document.getElementById('loadStatus').style.display = 'block';
            document.getElementById('loadStatus').textContent = 'Loading avatar.glb…';

            const loader = new GLTFLoader();
            const draco = new DRACOLoader();
            draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
            loader.setDRACOLoader(draco);

            loader.load('avatar.glb',
                (gltf) => {
                    const model = gltf.scene;
                    avatarModel = model;
                    avatarLoaded = true;
                    scene.add(model);
                    document.getElementById('loadStatus').style.display = 'none';

                    model.traverse((node) => {
                        if (node.isMesh && node.morphTargetInfluences && node.morphTargetDictionary) {
                            meshesWithMorphs.push(node);
                        }
                        if (!headBone && /^Head_M$/i.test(node.name)) headBone = node;
                        if (!neck1Bone && /^Neck_M$/i.test(node.name)) neck1Bone = node;
                        if (!leftEyeBone && node.name === 'EyeJoint_L') { leftEyeBone = node; leftEyeBaseQuat = node.quaternion.clone(); }
                        if (!rightEyeBone && node.name === 'EyeJoint_R') {
                            rightEyeBone = node;
                            const fix = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -0.01, 0));
                            rightEyeBaseQuat = node.quaternion.clone().multiply(fix);
                        }
                    });

                    // Animations
                    let allClips = [...(gltf.animations || [])];
                    model.traverse(n => { if (n.animations?.length) allClips.push(...n.animations); });
                    if (allClips.length > 0) {
                        avatarMixer = new THREE.AnimationMixer(model);
                        const eyeLookPattern = /eyeLook|EyeLook|eyeBlink|EyeBlink|EyeJoint/i;
                        allClips.forEach(clip => {
                            clip.tracks = clip.tracks.filter(t => {
                                // Filter morphTargetInfluences — driven procedurally (smile, visemes)
                                if (t.name.includes('.morphTargetInfluences')) return false;
                                if (eyeLookPattern.test(t.name)) return false;
                                return true;
                            });
                            const action = avatarMixer.clipAction(clip);
                            action.setLoop(THREE.LoopPingPong, Infinity);
                            action.play();
                        });
                    }

                    // Insert locators BEFORE starting the mixer so tracks still target the bones
                    neckLocator = insertLocator(neck1Bone);
                    headLocator = insertLocator(headBone);

                    updateHUD();
                    buildMorphPanel();
                    buildVisemePanel();
                    console.log(`[Debug] Loaded: ${meshesWithMorphs.length} morph meshes, ${allClips.length} clips, headBone=${headBone?.name}, neck=${neck1Bone?.name}`);
                },
                (progress) => {
                    if (progress.total > 0) {
                        const pct = (progress.loaded / progress.total * 100).toFixed(0);
                        document.getElementById('loadStatus').textContent = `Loading avatar.glb… ${pct}%`;
                    }
                },
                (err) => {
                    document.getElementById('loadStatus').textContent = 'Failed to load avatar.glb';
                    console.error('[Debug] Load error:', err);
                }
            );
        }

        // ════════════════════════════════════════════════════════════
        //  Viseme editor panel — per-viseme blendshape weight sliders
        // ════════════════════════════════════════════════════════════
        function buildVisemePanel() {
            const container = document.getElementById('vpVisemeList');
            container.innerHTML = '';

            for (const [visemeName, shapes] of Object.entries(VISEME_SHAPES)) {
                visemeOverrides[visemeName] = {};

                const section = document.createElement('div');
                section.className = 'vp-viseme';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'vp-viseme-name';
                nameDiv.textContent = visemeName;
                section.appendChild(nameDiv);

                for (const [bsName, defaultVal] of Object.entries(shapes)) {
                    if (bsName === 'jawOpen') continue; // jaw controlled globally
                    visemeOverrides[visemeName][bsName] = 1.0;

                    const row = document.createElement('div');
                    row.className = 'vp-bs-row';

                    const lbl = document.createElement('label');
                    lbl.title = bsName;
                    lbl.textContent = bsName;

                    // enable checkbox
                    const chk = document.createElement('input');
                    chk.type = 'checkbox'; chk.checked = true;

                    const slider = document.createElement('input');
                    slider.type = 'range'; slider.min = 0; slider.max = 2; slider.step = 0.01;
                    slider.value = 1.0;

                    const valSpan = document.createElement('span');
                    valSpan.className = 'vp-val';
                    valSpan.textContent = '1.00';

                    chk.addEventListener('change', () => {
                        visemeOverrides[visemeName][bsName] = chk.checked ? parseFloat(slider.value) : 0;
                        slider.disabled = !chk.checked;
                    });
                    slider.addEventListener('input', () => {
                        const v = parseFloat(slider.value);
                        visemeOverrides[visemeName][bsName] = chk.checked ? v : 0;
                        valSpan.textContent = v.toFixed(2);
                    });

                    row.appendChild(chk); row.appendChild(lbl); row.appendChild(slider); row.appendChild(valSpan);
                    section.appendChild(row);
                }
                container.appendChild(section);
            }
        }

        // ════════════════════════════════════════════════════════════
        //  Morph panel — sliders for every morph target
        // ════════════════════════════════════════════════════════════
        function buildMorphPanel() {
            const container = document.getElementById('morphList');
            if (meshesWithMorphs.length === 0) { container.innerHTML = '<em style="color:#666">No morph meshes</em>'; return; }

            const dict = meshesWithMorphs[0].morphTargetDictionary;
            const names = Object.keys(dict).sort();
            container.innerHTML = '';

            for (const name of names) {
                const row = document.createElement('div');
                row.className = 'morph-row';

                const lbl = document.createElement('label');
                lbl.title = name;
                lbl.textContent = name;

                const slider = document.createElement('input');
                slider.type = 'range'; slider.min = 0; slider.max = 1; slider.step = 0.01; slider.value = 0;

                const valSpan = document.createElement('span');
                valSpan.className = 'morph-val';
                valSpan.textContent = '0.00';

                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    morphOverrides[name] = v;
                    valSpan.textContent = v.toFixed(2);
                });

                row.appendChild(lbl); row.appendChild(slider); row.appendChild(valSpan);
                container.appendChild(row);
            }
        }

        // ════════════════════════════════════════════════════════════
        //  HUD update
        // ════════════════════════════════════════════════════════════
        function updateHUD() {
            document.getElementById('s-meshes').textContent = meshesWithMorphs.length;
            document.getElementById('s-head').textContent = headBone ? headBone.name : 'NONE';
            document.getElementById('s-neck').textContent = neck1Bone ? neck1Bone.name : 'NONE';
            document.getElementById('s-eyes').textContent = `L=${leftEyeBone ? 'yes' : 'no'} R=${rightEyeBone ? 'yes' : 'no'}`;
            document.getElementById('s-anims').textContent = avatarMixer ? `${avatarMixer._actions?.length ?? 0} action(s)` : 'none';
        }

        // ════════════════════════════════════════════════════════════
        //  Animate loop
        // ════════════════════════════════════════════════════════════
        function animate() {
            requestAnimationFrame(animate);
            if (paused) return;

            const now = performance.now();
            const delta = mixerClock.getDelta();

            if (avatarMixer && animEnabled) avatarMixer.update(delta);

            // Blink
            let blinkVal = 0;
            if (blinkEnabled) {
                if (now >= nextBlinkTime && blinkPhase === 0) blinkPhase = now;
                if (blinkPhase > 0) {
                    const el = now - blinkPhase;
                    if (el < BLINK_DURATION / 2) blinkVal = el / (BLINK_DURATION / 2);
                    else if (el < BLINK_DURATION) blinkVal = 1 - (el - BLINK_DURATION / 2) / (BLINK_DURATION / 2);
                    else { blinkPhase = 0; nextBlinkTime = now + 2000 + Math.random() * 4000; }
                }
            }

            // Gaze
            let camGazeX = 0, camGazeY = 0;
            if (lookAtEnabled) {
                const avatarPos = new THREE.Vector3(0, 1.5, 0);
                const diff = new THREE.Vector3().subVectors(camera.position, avatarPos);
                camGazeX = Math.atan2(diff.x, diff.z);
                camGazeY = Math.atan2(diff.y, Math.sqrt(diff.x * diff.x + diff.z * diff.z));

                if (now >= nextEyeMove) {
                    eyeLookAtTarget._idleOffX = (Math.random() - 0.5) * 0.3;
                    eyeLookAtTarget._idleOffY = (Math.random() - 0.5) * 0.2;
                    nextEyeMove = now + 1500 + Math.random() * 3000;
                }
                eyeLookAtTarget.set(camGazeX + (eyeLookAtTarget._idleOffX || 0), camGazeY + (eyeLookAtTarget._idleOffY || 0), 0);
                eyeLookAtCurrent.lerp(eyeLookAtTarget, 0.4);
            }

            const lx = -eyeLookAtCurrent.x, ly = eyeLookAtCurrent.y;

            // Eye blendshapes + blink + morph overrides
            for (const mesh of meshesWithMorphs) {
                const dict = mesh.morphTargetDictionary;
                const inf = mesh.morphTargetInfluences;

                // Blink
                if ('eyeBlinkLeft' in dict) inf[dict['eyeBlinkLeft']] = blinkVal;
                if ('eyeBlinkRight' in dict) inf[dict['eyeBlinkRight']] = blinkVal;
                if ('EyeBlinkLeft' in dict) inf[dict['EyeBlinkLeft']] = blinkVal;
                if ('EyeBlinkRight' in dict) inf[dict['EyeBlinkRight']] = blinkVal;

                if (lookAtEnabled) {
                    const setMorph = (name, val) => {
                        if (name in dict) { inf[dict[name]] = val; return; }
                        const alt = name.charAt(0).toUpperCase() + name.slice(1);
                        if (alt in dict) inf[dict[alt]] = val;
                    };
                    if (lx > 0) { setMorph('eyeLookInLeft', lx); setMorph('eyeLookOutRight', lx); setMorph('eyeLookOutLeft', 0); setMorph('eyeLookInRight', 0); }
                    else { setMorph('eyeLookOutLeft', -lx); setMorph('eyeLookInRight', -lx); setMorph('eyeLookInLeft', 0); setMorph('eyeLookOutRight', 0); }
                    if (ly > 0) { setMorph('eyeLookUpLeft', ly); setMorph('eyeLookUpRight', ly); setMorph('eyeLookDownLeft', 0); setMorph('eyeLookDownRight', 0); }
                    else { setMorph('eyeLookDownLeft', -ly); setMorph('eyeLookDownRight', -ly); setMorph('eyeLookUpLeft', 0); setMorph('eyeLookUpRight', 0); }
                }

                // Default idle smile — apply as floor
                for (const [smileName, smileVal] of Object.entries(audioEnabled ? SPEAKING_SMILE_SHAPES : IDLE_SMILE_SHAPES)) {
                    const lo = smileName.charAt(0).toLowerCase() + smileName.slice(1);
                    const up = smileName.charAt(0).toUpperCase() + smileName.slice(1);
                    const idx = dict[smileName] ?? dict[lo] ?? dict[up];
                    if (idx !== undefined) inf[idx] = Math.max(inf[idx] || 0, smileVal);
                }

                // Manual morph overrides from sliders
                for (const [name, val] of Object.entries(morphOverrides)) {
                    if (name in dict) inf[dict[name]] = val;
                }

                // Audio viseme weights — applied on top, try both cases
                for (const [bsName, val] of Object.entries(visemeWeights)) {
                    if (val < 0.001) continue;
                    const lower = bsName.charAt(0).toLowerCase() + bsName.slice(1);
                    const upper = bsName.charAt(0).toUpperCase() + bsName.slice(1);
                    if (lower in dict) inf[dict[lower]] = Math.min(1, val);
                    else if (upper in dict) inf[dict[upper]] = Math.min(1, val);
                }

                // Eyebrow raise driven by audio RMS
                if (smoothedBrow > 0.001) {
                    const bw = smoothedBrow;
                    const applyBrow = (name) => {
                        const lo = name.charAt(0).toLowerCase() + name.slice(1);
                        const up = name.charAt(0).toUpperCase() + name.slice(1);
                        if (lo in dict) inf[dict[lo]] = Math.min(1, bw);
                        else if (up in dict) inf[dict[up]] = Math.min(1, bw);
                    };
                    applyBrow('browInnerUp');
                    applyBrow('browOuterUpLeft');
                    applyBrow('browOuterUpRight');
                }
            }

            // Eye bones — blendshapes handle pupil direction.
            // Right eye corrected at load time; restore each frame.
            if (rightEyeBone && rightEyeBaseQuat) rightEyeBone.quaternion.copy(rightEyeBaseQuat);
            if (leftEyeBone && leftEyeBaseQuat) leftEyeBone.quaternion.copy(leftEyeBaseQuat);

            if (lookAtEnabled) {

                // Head/neck — drive the locators, not the bones
                const yaw = camGazeX * 0.5;
                const pitch = camGazeY * 0.3;
                setLocatorLookAt(neckLocator, yaw, pitch, 0.4);
                setLocatorLookAt(headLocator, yaw, pitch, 0.6);
            } else {
                // Reset locators to identity when look-at is off
                if (neckLocator) neckLocator.quaternion.identity();
                if (headLocator) headLocator.quaternion.identity();
            }

            // Audio viseme update
            const currentViseme = updateVisemeWeights();

            // Audio-driven head movement — subtle pitch nod proportional to RMS
            if (audioEnabled && headAudioStrength > 0 && (headLocator || neckLocator)) {
                const targetPitch = smoothedRms * headAudioStrength * 0.25; // max ~0.25 rad
                headAudioPitch += (targetPitch - headAudioPitch) * 0.08;
                if (headLocator) {
                    const e = new THREE.Euler().setFromQuaternion(headLocator.quaternion, 'YXZ');
                    e.x += headAudioPitch;
                    headLocator.quaternion.setFromEuler(e);
                }
                if (neckLocator) {
                    const e = new THREE.Euler().setFromQuaternion(neckLocator.quaternion, 'YXZ');
                    e.x += headAudioPitch * 0.5;
                    neckLocator.quaternion.setFromEuler(e);
                }
            } else {
                headAudioPitch += (0 - headAudioPitch) * 0.08;
            }

            // HUD live values
            if (avatarMixer) document.getElementById('s-time').textContent = avatarMixer.time.toFixed(3) + 's';
            document.getElementById('s-blink').textContent = blinkVal.toFixed(3);
            document.getElementById('s-lookat').textContent = lookAtEnabled ? `x=${camGazeX.toFixed(2)} y=${camGazeY.toFixed(2)}` : 'off';
            document.getElementById('s-viseme').textContent = currentViseme;
            document.getElementById('visemeFill').style.width = ((visemeWeights['jawOpen'] || 0) * 100).toFixed(1) + '%';

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ════════════════════════════════════════════════════════════
        //  Button handlers
        // ════════════════════════════════════════════════════════════
        document.getElementById('btnLookAt').addEventListener('click', (e) => {
            lookAtEnabled = !lookAtEnabled;
            e.target.textContent = `Look-at ${lookAtEnabled ? 'ON' : 'OFF'}`;
            e.target.classList.toggle('active', lookAtEnabled);
        });
        document.getElementById('btnBlink').addEventListener('click', (e) => {
            blinkEnabled = !blinkEnabled;
            e.target.textContent = `Blink ${blinkEnabled ? 'ON' : 'OFF'}`;
            e.target.classList.toggle('active', blinkEnabled);
        });
        document.getElementById('btnAnim').addEventListener('click', (e) => {
            animEnabled = !animEnabled;
            if (!animEnabled) mixerClock.getDelta(); // drain clock so delta doesn't accumulate
            e.target.textContent = `Anim ${animEnabled ? 'ON' : 'OFF'}`;
            e.target.classList.toggle('active', animEnabled);
        });
        document.getElementById('btnPause').addEventListener('click', (e) => {
            paused = !paused;
            if (!paused) mixerClock.getDelta();
            e.target.textContent = paused ? 'Resume' : 'Pause';
            e.target.classList.toggle('active', paused);
        });
        document.getElementById('btnReload').addEventListener('click', loadAvatar);

        document.getElementById('btnVisemeEditor').addEventListener('click', (e) => {
            const panel = document.getElementById('visemePanel');
            const visible = panel.style.display === 'block';
            panel.style.display = visible ? 'none' : 'block';
            e.target.classList.toggle('active', !visible);
        });

        document.getElementById('vpJawScale').addEventListener('input', (e) => {
            jawScale = parseFloat(e.target.value);
            document.getElementById('vpJawScaleVal').textContent = jawScale.toFixed(2);
        });
        // Set initial label
        document.getElementById('vpJawScaleVal').textContent = jawScale.toFixed(2);

        document.getElementById('vpHeadStrength').addEventListener('input', (e) => {
            headAudioStrength = parseFloat(e.target.value);
            document.getElementById('vpHeadStrengthVal').textContent = headAudioStrength.toFixed(2);
        });
        document.getElementById('vpHeadStrengthVal').textContent = headAudioStrength.toFixed(2);

        document.getElementById('vpSmoothSpeed').addEventListener('input', (e) => {
            visemeSmooth = parseFloat(e.target.value);
            document.getElementById('vpSmoothSpeedVal').textContent = visemeSmooth.toFixed(2);
        });
        document.getElementById('vpSmoothSpeedVal').textContent = visemeSmooth.toFixed(2);

        document.getElementById('vpAnticipation').addEventListener('input', (e) => {
            anticipation = parseFloat(e.target.value);
            document.getElementById('vpAnticipationVal').textContent = anticipation.toFixed(2);
        });
        document.getElementById('vpAnticipationVal').textContent = anticipation.toFixed(2);

        document.getElementById('vpBrowStrength').addEventListener('input', (e) => {
            browStrength = parseFloat(e.target.value);
            document.getElementById('vpBrowStrengthVal').textContent = browStrength.toFixed(2);
        });
        document.getElementById('vpBrowStrengthVal').textContent = browStrength.toFixed(2);

        document.getElementById('btnAudio').addEventListener('click', async (e) => {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (!audioEnabled) {
                audioEnabled = true;
                audioElement.play();
                e.target.textContent = '⏸ Audio';
                e.target.classList.add('active');
            } else {
                audioEnabled = false;
                audioElement.pause();
                e.target.textContent = '▶ Audio';
                e.target.classList.remove('active');
            }
        });

        // ════════════════════════════════════════════════════════════
        //  Initial load
        // ════════════════════════════════════════════════════════════
        loadAvatar();
    </script>
</body>
